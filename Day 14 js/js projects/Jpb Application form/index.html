<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Job Application Form</title>
  </head>

  <body>
    <div class="container">
      <div class="apply">
        <h1>Job Application <span id="small_txt">(Web)</span></h1>
        <form action="" class="form_container">
            <div class="content">
                <label for="name" class="label">First Name</label>
                <input type="text" placeholder="Enter first name" class="inputBox">
            </div>

            <div class="content">
                <label for="last name" class="label">Last Name</label>
                <input type="text" placeholder="Enter last name" class="inputBox">
            </div>

            <div class="content">
                <label for="Email" class="label">Email</label>
                <input type="email" placeholder="Enter Email" class="inputBox">
            </div>

            <div class="content">
                <label for="jobRole" class="label">Job Role</label>
                <select name="" id="jobRole">
                    <option value="">Select Job Role</option>
                    <option value="Developer">Developer</option>
                    <option value="Designer">Designer</option>
                    <option value="Manager">Manager</option>
                </select>

                <div class="content">
                    <label for="Address" class="label">Enter Address</label>
                    <input type="text">
                </div>

                <div class="content">
                    <label for="city" class="label">City</label>
                    <input type="text" placeholder="Enter City...." class="inputBox">
                </div>


                <div class="content">
                    <label for="pincode" class="label">PinCode</label>
                    <input type="number" placeholder="Enter pinCode...." class="inputBox">
                </div>

                <div class="content">
                    <label for="date" class="label">Start Date</label>
                    <input type="date" class="inputBox">
                </div>

                <div class="content">
                    <label for="file" class="label">Upload Your CV</label>
                    <input type="file" class="inputBox">
                </div>

            </div>
    </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
