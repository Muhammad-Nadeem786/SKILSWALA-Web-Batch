<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Weather Api</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Search city weather by city name " id="input_city">
                <button id="search_btn"><i class="fa-solid fa-magnifying-glass-location"></i></button>
        </div>

        <div class="weather">
            <img src="images/cloudy (2).png" alt="" width="150px" class="weather_icon">
            <h2 id="temp">22°C</h2>
            <h2 id="city">Islamabad</h1>
        </div>

        <div class="details">
            <div class="col">
                <img src="images/humidity-icon-128x104-1ny0xfws.png" width="80px" id="img_weather">
                <div>
                    <p id="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <i class="fa-solid fa-wind icon" ></i>
                <div>
                    <p id="wind">16km/h</p>
                    <p>wind speed</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
