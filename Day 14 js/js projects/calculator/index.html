<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
   <style>
    input{
        height: 100%;
        width: 100%;
    }
   </style>
</head>

<body>
    <table>
        <tr>
            <th colspan="3"><input type="text" id="a"></th>
            <th><input type="button" value="C" onclick="clear()"></th>
        </tr>
        <tr>
            <th><input type="button" value=1 onclick="pickValue(1)"></th>
            <th><input type="button" value=2 onclick="pickValue(2)"></th>
            <th><input type="button" value=3 onclick="pickValue(3)"></th>
            <th><input type="button" value="/"onclick="pickValue('/')"></th>
        </tr>
        <tr>
            <th><input type="button" value=4 onclick="pickValue(4)"></th>
            <th><input type="button" value=5 onclick="pickValue(5)"></th>
            <th><input type="button" value=6 onclick="pickValue(6)"></th>
            <th><input type="button" value="*" onclick="pickValue('*')"></th>
        </tr>
        <tr>
            <th><input type="button" value=7 onclick="pickValue(7)"></th>
            <th><input type="button" value=8 onclick="pickValue(8)"></th>
            <th><input type="button" value=9 onclick="pickValue(9)"></th>
            <th><input type="button" value="-" onclick="pickValue('-')"></th>
        </tr>
        <tr>
            <th><input type="button" value='.' onclick="pickValue('.')"></th>
            <th><input type="button" value=0 onclick="pickValue(0)"></th>
            <th><input type="button" value='=' onclick="solve()"></th>
            <th><input type="button" value="+" onclick="pickValue('+')"></th>
        </tr>
    </table>
    <script src="script.js"></script>
</body>
</html>
