<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables practice</title>
</head>

<body>

    <H4 align="center">Table in HTML</H4>
    <table border="1" align="center" style="text-align: center;">
        <thead>
            <tr>
                <th rowspan="3">Day</th>
                <th colspan="3">Seminar</th>
            </tr>
            <tr>
                <th colspan="2">Schedule</th>
                <th rowspan="3">Topic</th>
            </tr>
            <tr>
                <th>Begin</th>
                <th>End</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2" bgcolor="orange">8:00a.m</td>
                <td rowspan="2" bgcolor="lightblue">5:00p.m</td>
                <td>Introduction to XML</td>
            </tr>
            <tr>
                <td>Validity: DTD and Relex </td>
            </tr>
            <tr>
                <td rowspan="3">Tuesday</td>
                <td bgcolor="orange">8:00a.m </td>
                <td bgcolor="orange">11:00a.m</td>
                <td rowspan="2">Xpath</td>
            </tr>
            <tr>
                <td bgcolor="orange">11:00a.m</td>
                <td bgcolor="lightgreen">2:00p.m</td>
            </tr>
            <tr>
                <td bgcolor="lightgreen">2:00a.m</td>
                <td bgcolor="lightblue">5:00p.m</td>
                <td>XSL transformations</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td bgcolor="orange">8:00a.m</td>
                <td bgcolor="lightgreen">12:00p.m</td>
                <td>XSL formating objects</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
