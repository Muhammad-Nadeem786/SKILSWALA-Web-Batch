<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Level 1</th>
            <th>Level 2</th>
            <th>Level 3</th>
            <th>Info</th>
            <th>Name</th>
        </tr>
        <tr>
            <td rowspan="6">System</td>
            <td rowspan="4">System Apps</td>
            <td rowspan="3">SystemEnv</td>
            <td>AppTest</td>
            <td>foo</td>
        </tr>
        <tr>
            <td>App Memory</td>
            <td>foo</td>
        </tr>
        <tr>
            <td>App Test</td>
            <td>bar</td>
        </tr>
        <tr>
            <td>SystemEnv2</td>
            <td>App Test</td>
            <td>bar</td>
        </tr>
        <tr>
            <td rowspan="2">System Memory</td>
            <td rowspan="2">Memory test</td>
            <td>Memory fuse</td>
            <td>foo</td>
        </tr>
        <tr>
            <td>App test</td>
            <td>Foo</td>
        </tr>
    </table>

    <div style="height: 350px; width: 250px; border: 1px solid black; margin: 10px">
        <div style="height: 100px; width: 100px; background-color: red; border: 1px; border-radius: 50%; margin: 10px;"></div>
        <div style="height: 100px; width: 100px; background-color: yellow; border: 1px; border-radius: 50%; margin: 10px"></div>
        <div style="height: 100px; width: 100px; background-color: green; border: 1px; border-radius: 50%; margin: 10px"></div>
    </div>
</body>
</html>
